<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#58CC02" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>SawasdeeLingo — Leer Thais in Duolingo-stijl</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Nunito (speels & Duolingo-stijl) + Noto Sans Thai (scherp Thais schrift) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Basislettertypen & mobiele touch-optimalisatie */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .thai-text {
      font-family: 'Noto Sans Thai', 'Nunito', sans-serif;
      line-height: 1.5;
    }

    /* Duolingo 3D-knop stijl */
    .duo-btn {
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, background-color 0.15s ease;
      user-select: none;
    }
    .duo-btn:active:not(:disabled) {
      transform: translateY(3px);
    }

    /* Animaties voor feedback, combo en mascotte */
    @keyframes bounceIn {
      0% { transform: scale(0.85); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    .animate-bounce-in {
      animation: bounceIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.35s ease;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floatSlow 2.8s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.45); }
      70% { box-shadow: 0 0 0 14px rgba(88, 204, 2, 0); }
      100% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0); }
    }
    .pulse-active {
      animation: pulseRing 2s infinite;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120px) rotate(360deg); opacity: 0; }
    }

    /* Verberg scrollbars maar behoud vloeiend scrollen */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center">

  <!-- Mobiele App Container (gecentreerd op desktop, volledig scherm op telefoon) -->
  <div id="app" class="w-full max-w-md min-h-screen bg-white shadow-2xl relative flex flex-col overflow-x-hidden">
    <!-- Inhoud wordt dynamisch gerenderd door JavaScript -->
  </div>

  <script>
    /* ============================================================================
     * SAWASDEELINGO — VOLLEDIGE THAISE TAALLEERAPP VOOR NEDERLANDSTALIGEN
     * Architectuur:
     * 1. Geluidseffecten (Web Audio API) & Thaise Spraaksynthese (Web Speech API)
     * 2. Authentieke 20-Niveaus Leerstoflijst (Woorden + Zinnen + Didactische Tips)
     * 3. Spaced Repetition System (Leitner Box 0-5) & LocalStorage State Manager
     * 4. Dynamische Opdracht- & Examen-generator (10 opdrachten/niveau, 8+ oefeningen)
     * 5. Reactieve UI-Renderer (Leren, Herhalen, Woorden, Profiel, Les-engine, Tour)
     * ============================================================================ */

    // -------------------------
    // 1. GELUID & SPRAAK ENGINE
    // -------------------------
    const SoundFX = (() => {
      let ctx = null;
      function getCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function playTone(freq, startOffset, duration, type = 'sine', gainVal = 0.14) {
        if (!AppState.settings.soundOn) return;
        try {
          const ac = getCtx();
          if (!ac) return;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ac.currentTime + startOffset);
          gain.gain.setValueAtTime(0.001, ac.currentTime + startOffset);
          gain.gain.exponentialRampToValueAtTime(gainVal, ac.currentTime + startOffset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + startOffset + duration);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(ac.currentTime + startOffset);
          osc.stop(ac.currentTime + startOffset + duration + 0.02);
        } catch (e) {}
      }

      return {
        correct() {
          playTone(523.25, 0, 0.12, 'triangle', 0.18); // C5
          playTone(659.25, 0.09, 0.14, 'triangle', 0.18); // E5
          playTone(783.99, 0.18, 0.22, 'triangle', 0.18); // G5
        },
        wrong() {
          playTone(230, 0, 0.14, 'sawtooth', 0.09);
          playTone(185, 0.12, 0.22, 'sawtooth', 0.09);
        },
        pop() {
          playTone(640, 0, 0.06, 'sine', 0.1);
        },
        complete() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, i) => playTone(n, i * 0.1, 0.25, 'triangle', 0.18));
        },
        fail() {
          playTone(349.23, 0, 0.18, 'sine', 0.12);
          playTone(311.13, 0.16, 0.18, 'sine', 0.12);
          playTone(261.63, 0.32, 0.32, 'sine', 0.12);
        }
      };
    })();

    // Web Speech API voor Thais (met slimme fallback als th-TH stem ontbreekt)
    const SpeechEngine = (() => {
      let thaiVoice = null;
      let checkedVoices = false;
      let warnedNoVoice = false;

      function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices() || [];
        thaiVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('th')) || null;
        if (voices.length > 0) checkedVoices = true;
      }

      if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      function speak(thaiText, slow = false) {
        SoundFX.pop();
        if (!('speechSynthesis' in window)) {
          if (!warnedNoVoice) {
            showToast('Spraak niet ondersteund in deze browser — gebruik de fonetische uitspraak.', 'info');
            warnedNoVoice = true;
          }
          return false;
        }
        try {
          loadVoices();
          window.speechSynthesis.cancel();
          const clean = thaiText.replace(/\[.*?\]/g, '').trim();
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = 'th-TH';
          if (thaiVoice) {
            utter.voice = thaiVoice;
          } else if (checkedVoices && !warnedNoVoice) {
            showToast('Geen Thaise stem geïnstalleerd op dit apparaat — lees de fonetiek mee!', 'info');
            warnedNoVoice = true;
          }
          utter.rate = slow ? 0.58 : 0.9;
          utter.pitch = 1.0;
          window.speechSynthesis.speak(utter);
          return true;
        } catch (e) {
          return false;
        }
      }

      function hasThaiVoice() {
        loadVoices();
        return !!thaiVoice;
      }

      return { speak, hasThaiVoice };
    })();

    // Dynamische vervanging van beleefdheidsvorm (Man ครับ / Vrouw ค่ะ) en Ik (ผม / ฉัน)
    function formatThai(str) {
      if (!str) return '';
      const isMale = AppState.settings.gender === 'male';
      return str
        .replace(/\{P\}/g, isMale ? 'ครับ' : 'ค่ะ')
        .replace(/\{I\}/g, isMale ? 'ผม' : 'ฉัน')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatPhonetic(str) {
      if (!str) return '';
      const isMale = AppState.settings.gender === 'male';
      return str
        .replace(/\{p\}/g, isMale ? 'khrap' : 'kha')
        .replace(/\{i\}/g, isMale ? 'phom' : 'tsjan')
        .replace(/\s+/g, ' ')
        .trim();
    }

      };
    }

    let AppState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        const def = createDefaultState();
        const merged = {
          ...def,
          ...parsed,
          settings: { ...def.settings, ...(parsed.settings || {}) }
        };
        return merged;
      } catch (e) {
        return createDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
      } catch (e) {}
    }

    // Automatisch hartjes aanvullen (1 hartje per 15 minuten) & dagelijkse XP resetten op nieuwe dag
    function syncDailyAndHearts() {
      const today = getTodayStr();
      if (AppState.lastActiveDate && AppState.lastActiveDate !== today) {
        const last = new Date(AppState.lastActiveDate);
        const now = new Date(today);
        const diffDays = Math.round((now - last) / (1000 * 60 * 60 * 24));
        if (diffDays > 1) {
          AppState.streak = 0; // Streak verlopen na >1 dag gemist
        }
        AppState.dailyXp = 0;
      }
      // Hartjes regeneratie
      if (AppState.hearts < 5) {
        const elapsedMin = Math.floor((Date.now() - (AppState.lastHeartRegen || Date.now())) / 60000);
        const regen = Math.floor(elapsedMin / 15);
        if (regen > 0) {
          AppState.hearts = Math.min(5, AppState.hearts + regen);
          AppState.lastHeartRegen = Date.now();
        }
      }
      saveState();
    }

    function recordActivityXp(amount) {
      const today = getTodayStr();
      if (AppState.lastActiveDate !== today) {
        const prev = AppState.lastActiveDate ? new Date(AppState.lastActiveDate) : null;
        const curr = new Date(today);
        const diff = prev ? Math.round((curr - prev) / (1000 * 60 * 60 * 24)) : 99;
        AppState.streak = diff === 1 ? AppState.streak + 1 : 1;
        AppState.lastActiveDate = today;
        AppState.dailyXp = 0;
      }
      AppState.xp += amount;
      AppState.dailyXp += amount;
      checkNewBadges();
      saveState();
    }

    function checkNewBadges() {

        }
      });
    }

    // -------------------------
    // 4. SPACED REPETITION SYSTEM (LEITNER BOX 0-5)
    // -------------------------
    const SRS_INTERVALS_MS = [
      0,
      10 * 60 * 1000,           // Box 1: 10 minuten
      24 * 60 * 60 * 1000,      // Box 2: 1 dag
      3 * 24 * 60 * 60 * 1000,  // Box 3: 3 dagen
      7 * 24 * 60 * 60 * 1000,  // Box 4: 7 dagen
      21 * 24 * 60 * 60 * 1000  // Box 5: 21 dagen
    ];

    function updateSRS(wordId, isCorrect) {
      if (!wordId || !WORD_MAP[wordId]) return;
      const now = Date.now();
      const cur = AppState.srs[wordId] || { box: 0, correct: 0, wrong: 0, nextReview: 0 };
      if (isCorrect) {
        cur.box = Math.min(5, cur.box + 1);
        cur.correct += 1;
        cur.nextReview = now + SRS_INTERVALS_MS[cur.box];
      } else {
        cur.box = Math.max(1, cur.box - 2);
        cur.wrong += 1;
        cur.nextReview = now; // Direct weer klaar voor herhaling!
      }
      AppState.srs[wordId] = cur;
      saveState();
    }

    function getDueWords() {
      const now = Date.now();
      return Object.entries(AppState.srs)
        .filter(([id, data]) => WORD_MAP[id] && (data.nextReview <= now || data.box <= 1))
        .sort((a, b) => a[1].box - b[1].box || a[1].nextReview - b[1].nextReview)
        .map(([id]) => WORD_MAP[id]);
    }

    function getWeakWords(maxLevelId = 20) {
      return Object.entries(AppState.srs)
        .filter(([id, data]) => WORD_MAP[id] && WORD_MAP[id].levelId <= maxLevelId && (data.wrong > 0 || data.box <= 2))
        .sort((a, b) => (b[1].wrong - a[1].wrong) || (a[1].box - b[1].box))
        .map(([id]) => WORD_MAP[id]);
    }

    // -------------------------
    // 5. HULPFUNCTIES & OEFENING-GENERATOR
    // -------------------------
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickDistractors(targetWord, pool, count = 3) {
      const candidates = shuffle(pool.filter(w => w.id !== targetWord.id && w.nl !== targetWord.nl));
      const picked = candidates.slice(0, count);
      if (picked.length < count) {
        const extra = shuffle(ALL_WORDS.filter(w => w.id !== targetWord.id && !picked.some(p => p.id === w.id)));
        picked.push(...extra.slice(0, count - picked.length));
      }
      return picked;
    }

    // Maak individuele oefening objecten (6 verschillende wetenschappelijk onderbouwde werkvormen)
    function makeMcThNl(word, pool) {
      const dist = pickDistractors(word, pool, 3);
      const options = shuffle([word, ...dist]).map(w => ({
        id: w.id,
        label: w.nl,
        isCorrect: w.id === word.id
      }));
      return {
        type: 'mc_th_nl',
        wordId: word.id,
        promptLabel: 'Wat betekent dit in het Nederlands?',
        thai: word.th,
        phonetic: word.ph,
        tone: word.tone,
        note: word.note || '',
        options,
        answerText: word.nl
      };
    }

    function makeMcNlTh(word, pool) {
      const dist = pickDistractors(word, pool, 3);
      const options = shuffle([word, ...dist]).map(w => ({
        id: w.id,
        thai: w.th,
        phonetic: w.ph,
        isCorrect: w.id === word.id
      }));
      return {
        type: 'mc_nl_th',
        wordId: word.id,
        promptLabel: 'Kies de juiste Thaise vertaling',
        nlPrompt: word.nl,
        note: word.note || '',
        options,
        answerText: `${formatThai(word.th)} (${formatPhonetic(word.ph)})`
      };
    }

    function makeListenEx(word, pool) {
      const dist = pickDistractors(word, pool, 3);
      const options = shuffle([word, ...dist]).map(w => ({
        id: w.id,
        label: w.nl,
        thai: w.th,
        phonetic: w.ph,
        isCorrect: w.id === word.id
      }));
      return {
        type: 'listen',
        wordId: word.id,
        promptLabel: 'Luister goed: wat hoor je?',
        thai: word.th,
        phonetic: word.ph,
        tone: word.tone,
        options,
        answerText: `${formatThai(word.th)} — ${word.nl}`
      };
    }

    function makeBuildSentenceEx(sentence, wordPool) {
      const correctTokens = sentence.tokens.map(t => formatThai(t));
      // Voeg 2-3 afleiders toe uit de niveau-woordenschat
      const distractors = shuffle(wordPool)
        .map(w => formatThai(w.th).split(' ')[0])
        .filter(t => t && !correctTokens.includes(t))
        .slice(0, Math.min(3, Math.max(2, 6 - correctTokens.length)));

      const bank = shuffle([...correctTokens, ...distractors]).map((text, idx) => ({
        uid: `tok_${idx}_${Math.random().toString(36).slice(2, 6)}`,
        text
      }));

      return {
        type: 'build_sentence',
        promptLabel: 'Bouw deze zin in het Thais',
        nlPrompt: sentence.nl,
        fullThai: sentence.th,
        fullPhonetic: sentence.ph,
        correctTokens,
        bank,
        answerText: `${formatThai(sentence.th)} (${formatPhonetic(sentence.ph)})`
      };
    }

    function makeClozeEx(sentence, wordPool) {
      const idx = Math.min(sentence.blankIdx || 0, sentence.tokens.length - 1);
      const missingRaw = sentence.tokens[idx];
      const missingFormatted = formatThai(missingRaw);

      // Zoek eventuele fonetische hulp voor opties
      const distCandidates = shuffle(wordPool)
        .filter(w => formatThai(w.th) !== missingFormatted && formatThai(w.th).split(' ')[0] !== missingFormatted)
        .slice(0, 3)
        .map(w => ({ text: formatThai(w.th), ph: formatPhonetic(w.ph), isCorrect: false }));

      // Vind fonetiek voor correct woord indien bekend
      const matchedWord = ALL_WORDS.find(w => formatThai(w.th) === missingFormatted || formatThai(w.th).startsWith(missingFormatted));
      const correctOpt = {
        text: missingFormatted,
        ph: matchedWord ? formatPhonetic(matchedWord.ph) : '',
        isCorrect: true
      };

      return {
        type: 'cloze',
        promptLabel: 'Vul het ontbrekende Thaise woord in',
        nlPrompt: sentence.nl,
        tokens: sentence.tokens.map(t => formatThai(t)),
        blankIdx: idx,
        fullThai: sentence.th,
        fullPhonetic: sentence.ph,
        options: shuffle([correctOpt, ...distCandidates]),
        answerText: `${formatThai(sentence.th)} (${formatPhonetic(sentence.ph)})`
      };
    }

    function makeMatchPairsEx(wordsSubset) {
      const chosen = shuffle(wordsSubset).slice(0, 4);
      return {
        type: 'match_pairs',
        promptLabel: 'Koppel de juiste paren aan elkaar',
        wordIds: chosen.map(w => w.id),
        leftItems: shuffle(chosen.map(w => ({ id: w.id, thai: w.th, phonetic: w.ph }))),
        rightItems: shuffle(chosen.map(w => ({ id: w.id, nl: w.nl }))),
        answerText: 'Alle 4 paren gekoppeld!'
      };
    }

    // Genereer minimaal 8 oefeningen voor een specifieke Opdracht (0..9) in een Niveau (1..20)
    function generateTaskExercises(levelId, taskIdx) {
      const level = LEVELS.find(l => l.id === levelId);
      const words = level.words;
      const sentences = level.sentences;
      const priorWords = ALL_WORDS.filter(w => w.levelId < levelId);
      const priorSentences = LEVELS.filter(l => l.id < levelId).flatMap(l => l.sentences);
      const pool = [...words, ...priorWords];

      const half = Math.ceil(words.length / 2);
      const groupA = words.slice(0, half);
      const groupB = words.slice(half);
      const exercises = [];

      switch (taskIdx) {
        case 0: // Kernwoorden A (8 oefeningen)
          groupA.forEach(w => exercises.push(makeMcThNl(w, words)));
          groupA.slice(0, 2).forEach(w => exercises.push(makeListenEx(w, words)));
          exercises.push(makeMatchPairsEx(groupA.length >= 4 ? groupA : words));
          exercises.push(makeMcNlTh(groupA[0], words));
          if (exercises.length < 8) exercises.push(makeMcNlTh(groupA[groupA.length - 1], words));
          break;

        case 1: // Kernwoorden B (8 oefeningen)
          groupB.forEach(w => exercises.push(makeMcThNl(w, words)));
          groupB.slice(0, 2).forEach(w => exercises.push(makeMcNlTh(w, words)));
          exercises.push(makeListenEx(groupB[0] || words[0], words));
          exercises.push(makeMatchPairsEx(groupB.length >= 4 ? groupB : words));
          if (exercises.length < 8) exercises.push(makeListenEx(groupB[groupB.length - 1] || words[1], words));
          break;

        case 2: // Luisteren & Uitspraak (8 oefeningen)
          shuffle(words).slice(0, 5).forEach(w => exercises.push(makeListenEx(w, words)));
          shuffle(words).slice(0, 2).forEach(w => exercises.push(makeMcThNl(w, words)));
          exercises.push(makeMatchPairsEx(words));
          break;

        case 3: // Eerste Zinnen (8 oefeningen)
          sentences.slice(0, 3).forEach(s => exercises.push(makeBuildSentenceEx(s, words)));
          sentences.slice(0, 2).forEach(s => exercises.push(makeClozeEx(s, words)));
          shuffle(words).slice(0, 2).forEach(w => exercises.push(makeMcNlTh(w, words)));
          exercises.push(makeListenEx(words[0], words));
          break;

        case 4: // Snelkoppelen (8 oefeningen)
          exercises.push(makeMatchPairsEx(words.slice(0, 4)));
          exercises.push(makeMatchPairsEx(words.slice(-4)));
          shuffle(words).slice(0, 3).forEach(w => exercises.push(makeMcNlTh(w, words)));
          shuffle(words).slice(0, 3).forEach(w => exercises.push(makeMcThNl(w, words)));
          break;

        case 5: // Woordenschat Verdiepen (8 oefeningen)
          shuffle(words).slice(0, 3).forEach(w => exercises.push(makeMcNlTh(w, pool)));
          shuffle(sentences).slice(0, 3).forEach(s => exercises.push(makeClozeEx(s, words)));
          shuffle(words).slice(0, 2).forEach(w => exercises.push(makeListenEx(w, pool)));
          break;

        case 6: // Zinnen Bouwen (8 oefeningen)
          sentences.forEach(s => exercises.push(makeBuildSentenceEx(s, words)));
          sentences.slice(0, 2).forEach(s => exercises.push(makeClozeEx(s, words)));
          exercises.push(makeMatchPairsEx(words));
          break;

        case 7: { // Actieve Herhaling (SRS + Interleaving met eerdere niveaus, 8-9 oefeningen)
          const weak = getWeakWords(levelId);
          const reviewPool = weak.length > 0 ? weak : (priorWords.length > 0 ? shuffle(priorWords) : shuffle(words));
          reviewPool.slice(0, 3).forEach((w, i) => {
            exercises.push(i % 2 === 0 ? makeMcNlTh(w, pool) : makeListenEx(w, pool));
          });
          shuffle(words).slice(0, 2).forEach(w => exercises.push(makeMcThNl(w, pool)));
          exercises.push(makeBuildSentenceEx(sentences[0], words));
          exercises.push(makeClozeEx(sentences[sentences.length - 1], words));
          exercises.push(makeMatchPairsEx([...words.slice(0, 2), ...(priorWords.length >= 2 ? shuffle(priorWords).slice(0, 2) : words.slice(2, 4))]));
          break;
        }

        case 8: // Praktijksituatie (8 oefeningen)
          shuffle(sentences).slice(0, 3).forEach(s => exercises.push(makeBuildSentenceEx(s, pool)));
          shuffle(sentences).slice(0, 2).forEach(s => exercises.push(makeClozeEx(s, pool)));
          shuffle(words).slice(0, 3).forEach(w => exercises.push(makeListenEx(w, pool)));
          break;

        case 9: // Niveau-Mix (9 oefeningen als generale repetitie voor examen)
        default:
          shuffle(words).slice(0, 2).forEach(w => exercises.push(makeMcThNl(w, pool)));
          shuffle(words).slice(0, 2).forEach(w => exercises.push(makeMcNlTh(w, pool)));
          exercises.push(makeListenEx(shuffle(words)[0], pool));
          exercises.push(makeBuildSentenceEx(shuffle(sentences)[0], words));
          exercises.push(makeClozeEx(shuffle(sentences)[1] || sentences[0], words));
          exercises.push(makeMatchPairsEx(words));
          if (priorSentences.length > 0) {
            exercises.push(makeBuildSentenceEx(shuffle(priorSentences)[0], pool));
          } else {
            exercises.push(makeListenEx(shuffle(words)[1] || words[0], pool));
          }
          break;
      }

      // Garandeer altijd minimaal 8 oefeningen
      let safety = 0;
      while (exercises.length < 8 && safety < 10) {
        const w = words[safety % words.length];
        exercises.push(safety % 2 === 0 ? makeMcNlTh(w, pool) : makeListenEx(w, pool));
        safety++;
      }

      return exercises.slice(0, 9);
    }

    // Genereer Niveau-Examen (10 vragen: ~65% huidig niveau + ~35% cumulatieve eerdere niveaus, slagingsgrens 80%)
    function generateExamExercises(levelId) {
      const level = LEVELS.find(l => l.id === levelId);
      const priorWords = ALL_WORDS.filter(w => w.levelId < levelId);
      const priorSentences = LEVELS.filter(l => l.id < levelId).flatMap(l => l.sentences);
      const allPool = [...level.words, ...priorWords];
      const exercises = [];

      const curWords = shuffle(level.words);
      const curSents = shuffle(level.sentences);

      // 6-7 vragen uit huidig niveau (~65%)
      exercises.push(makeMcThNl(curWords[0], allPool));
      exercises.push(makeMcNlTh(curWords[1 % curWords.length], allPool));
      exercises.push(makeListenEx(curWords[2 % curWords.length], allPool));
      exercises.push(makeBuildSentenceEx(curSents[0], level.words));
      exercises.push(makeClozeEx(curSents[1 % curSents.length], level.words));
      exercises.push(makeMatchPairsEx(level.words));

      if (levelId === 1 || priorWords.length < 3) {
        // Niveau 1 heeft geen voorgaande niveaus: 4 extra vragen uit Niveau 1
        exercises.push(makeMcNlTh(curWords[3 % curWords.length], level.words));
        exercises.push(makeListenEx(curWords[4 % curWords.length], level.words));
        exercises.push(makeBuildSentenceEx(curSents[2 % curSents.length], level.words));
        exercises.push(makeClozeEx(curSents[3 % curSents.length], level.words));
      } else {
        // Cumulatieve herhaling uit eerdere niveaus (~35-40% = 4 vragen, met prioriteit voor zwakkere SRS woorden)
        const weakPrior = getWeakWords(levelId - 1);
        const pickedPrior = shuffle([...weakPrior, ...shuffle(priorWords)]).filter((v, i, a) => a.findIndex(x => x.id === v.id) === i);
        exercises.push(makeMcThNl(pickedPrior[0], allPool));
        exercises.push(makeMcNlTh(pickedPrior[1 % pickedPrior.length], allPool));
        exercises.push(makeListenEx(pickedPrior[2 % pickedPrior.length], allPool));
        if (priorSentences.length > 0) {
          exercises.push(makeBuildSentenceEx(shuffle(priorSentences)[0], allPool));
        } else {
          exercises.push(makeMcNlTh(curWords[3 % curWords.length], allPool));
        }
      }

      return shuffle(exercises).slice(0, 10);
    }

    // Genereer SRS Herhaalsessie of Hartjes-Terugverdien-Sessie
    function generateReviewExercises(mode = 'srs') {
      const unlockedPool = ALL_WORDS.filter(w => w.levelId <= (AppState.settings.unlockAllPreview ? 20 : AppState.unlockedLevel));
      const due = getDueWords();
      const learned = Object.keys(AppState.srs).map(id => WORD_MAP[id]).filter(Boolean);
      let source = due.length >= 4 ? due : (learned.length >= 4 ? shuffle(learned) : shuffle(unlockedPool));
      if (source.length < 4) source = shuffle(unlockedPool);

      const count = mode === 'hearts' ? 5 : 8;
      const exercises = [];

      for (let i = 0; i < count; i++) {
        const w = source[i % source.length];
        if (mode === 'listen') {
          exercises.push(makeListenEx(w, unlockedPool));
        } else if (i === 3 && source.length >= 4) {
          exercises.push(makeMatchPairsEx(source.slice(0, 4)));
        } else if (i % 3 === 0) {
          exercises.push(makeMcThNl(w, unlockedPool));
        } else if (i % 3 === 1) {
          exercises.push(makeMcNlTh(w, unlockedPool));
        } else {
          exercises.push(makeListenEx(w, unlockedPool));
        }
      }
      return exercises;
    }

    // Toast melding
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = {
        success: 'bg-[#58CC02] text-white border-[#46A302]',
        error: 'bg-[#FF4B4B] text-white border-[#D63030]',
        info: 'bg-slate-800 text-white border-slate-900'
      };
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border-b-4 shadow-lg text-sm font-bold text-center animate-bounce-in ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

            <button onclick="closeModal()" class="w-full py-2 text-slate-500 font-bold text-sm">Later verdergaan</button>
          </div>
        </div>
      `);
    }

    function buyHeartsWithGems() {
      if (AppState.gems < 20) {
        showToast('Niet genoeg edelstenen! Gebruik de gratis herhaalronde.', 'error');
        return;
      }
      AppState.gems -= 20;
      AppState.hearts = 5;
      saveState();
      closeModal();
      SoundFX.correct();
      showToast('❤️ Je hebt weer 5 volle hartjes!', 'success');
      render();
    }

    // -------------------------
    // 8. LES-, HERHAAL- & EXAMEN-ENGINE
    // -------------------------
    function isLevelUnlocked(levelId) {
      return AppState.settings.unlockAllPreview || levelId <= AppState.unlockedLevel;
    }

    function isTaskDone(levelId, taskIdx) {
      return (AppState.completedTasks[String(levelId)] || []).includes(taskIdx);
    }

    function isTaskUnlocked(levelId, taskIdx) {
      if (AppState.settings.unlockAllPreview) return true;
      if (!isLevelUnlocked(levelId)) return false;
      if (taskIdx === 0) return true;
      return isTaskDone(levelId, taskIdx - 1);
    }

    function isExamUnlocked(levelId) {
      if (AppState.settings.unlockAllPreview) return true;
      if (!isLevelUnlocked(levelId)) return false;
      const done = AppState.completedTasks[String(levelId)] || [];
      return done.length >= 10;
    }

    function startTaskSession(levelId, taskIdx) {
      if (!isTaskUnlocked(levelId, taskIdx)) {
        showToast('Rond eerst de vorige opdracht af!', 'info');
        return;
      }
      if (AppState.hearts <= 0) {
        showNoHeartsModal();
        return;
      }
      SoundFX.pop();
      const exercises = generateTaskExercises(levelId, taskIdx);
      UI.session = {
        mode: 'task',
        levelId,
        taskIdx,
        title: `Niveau ${levelId} • ${TASK_TITLES[taskIdx].name}`,
        queue: exercises,
        mistakeQueue: [],
        inRetryPhase: false,
        index: 0,
        totalInitial: exercises.length,
        correctFirstTry: 0,
        wrongCount: 0,
        combo: 0,
        maxCombo: 0,
        // Status voor huidige oefening
        selectedOption: null,
        builtTokens: [],
        matchState: { selectedLeft: null, selectedRight: null, matchedIds: [], wrongFlash: false },
        feedback: null, // null | { correct: bool, message: string, detail: string }
        finished: false
      };
      render();
      autoPlayIfListen();
    }

    function startExamSession(levelId) {
      if (!isExamUnlocked(levelId)) {
        showToast('Voltooi eerst alle 10 opdrachten van dit niveau!', 'info');
        return;
      }
      SoundFX.pop();
      const exercises = generateExamExercises(levelId);
      UI.session = {
        mode: 'exam',
        levelId,
        taskIdx: null,
        title: `🏆 Niveau ${levelId} Examen`,
        queue: exercises,
        mistakeQueue: [],
        inRetryPhase: false,
        index: 0,
        totalInitial: exercises.length,
        correctFirstTry: 0,
        wrongCount: 0,
        combo: 0,
        maxCombo: 0,
        selectedOption: null,
        builtTokens: [],
        matchState: { selectedLeft: null, selectedRight: null, matchedIds: [], wrongFlash: false },
        feedback: null,
        finished: false
      };
      render();
      autoPlayIfListen();
    }

    function startReviewSession(submode = 'srs') {
      SoundFX.pop();
      const exercises = generateReviewExercises(submode);
      const titles = {
        srs: '🔄 SRS Herhaalsessie',
        hearts: '❤️ Hartjes Terugverdienen',
        listen: '🎧 Luistertraining'
      };
      UI.session = {
        mode: submode,
        levelId: null,
        taskIdx: null,
        title: titles[submode] || 'Herhalen',
        queue: exercises,
        mistakeQueue: [],
        inRetryPhase: false,
        index: 0,
        totalInitial: exercises.length,
        correctFirstTry: 0,
        wrongCount: 0,
        combo: 0,
        maxCombo: 0,
        selectedOption: null,
        builtTokens: [],
        matchState: { selectedLeft: null, selectedRight: null, matchedIds: [], wrongFlash: false },
        feedback: null,
        finished: false
      };
      render();
      autoPlayIfListen();
    }

    function autoPlayIfListen() {
      const s = UI.session;
      if (!s || s.finished) return;
      const ex = s.queue[s.index];
      if (ex && (ex.type === 'listen' || ex.type === 'mc_th_nl')) {
        setTimeout(() => {
          if (UI.session === s && !s.finished && s.queue[s.index] === ex) {
            SpeechEngine.speak(formatThai(ex.thai), false);
          }
        }, 250);
      }
    }

    function exitSessionConfirm() {
      openModal(`
        <div class="p-6 text-center space-y-4">
          <div>${renderElephantSVG('sad', 70)}</div>
          <h3 class="text-lg font-black text-slate-800">Weet je zeker dat je wilt stoppen?</h3>
          <p class="text-sm text-slate-600">Je voortgang in deze oefening gaat dan verloren.</p>
          <div class="space-y-2 pt-1">
            <button onclick="closeModal()" class="duo-btn w-full py-3 rounded-2xl bg-[#1CB0F6] border-b-4 border-[#1899D6] text-white font-extrabold text-sm">Verder oefenen</button>
            <button onclick="closeModal(); UI.session = null; render();" class="w-full py-2.5 rounded-2xl text-[#FF4B4B] font-extrabold text-sm hover:bg-red-50">Stoppen</button>
          </div>
        </div>
      `);
    }

    // Interacties binnen een oefening
    function selectOption(idx) {
      const s = UI.session;
      if (!s || s.feedback) return;
      SoundFX.pop();
      s.selectedOption = idx;
      const ex = s.queue[s.index];
      if (ex.type === 'mc_nl_th' && ex.options[idx]) {
        SpeechEngine.speak(formatThai(ex.options[idx].thai), false);
      } else if (ex.type === 'cloze' && ex.options[idx]) {
        SpeechEngine.speak(ex.options[idx].text, false);
      }
      render();
    }

    function tapBankToken(uid) {
      const s = UI.session;
      if (!s || s.feedback) return;
      const ex = s.queue[s.index];
      const tok = ex.bank.find(t => t.uid === uid);
      if (!tok || s.builtTokens.some(t => t.uid === uid)) return;
      SoundFX.pop();
      SpeechEngine.speak(tok.text, false);
      s.builtTokens.push(tok);
      render();
    }

    function removeBuiltToken(uid) {
      const s = UI.session;
      if (!s || s.feedback) return;
      SoundFX.pop();
      s.builtTokens = s.builtTokens.filter(t => t.uid !== uid);
      render();
    }

    function tapMatchCard(side, id) {
      const s = UI.session;
      if (!s || s.feedback) return;
      const ms = s.matchState;
      if (ms.matchedIds.includes(id)) return;
      SoundFX.pop();

      const ex = s.queue[s.index];
      if (side === 'left') {
        ms.selectedLeft = id;
        const item = ex.leftItems.find(x => x.id === id);
        if (item) SpeechEngine.speak(formatThai(item.thai), false);
      } else {
        ms.selectedRight = id;
      }

      if (ms.selectedLeft && ms.selectedRight) {
        if (ms.selectedLeft === ms.selectedRight) {
          ms.matchedIds.push(ms.selectedLeft);
          updateSRS(ms.selectedLeft, true);
          ms.selectedLeft = null;
          ms.selectedRight = null;
          SoundFX.correct();

          // Alle paren gekoppeld?
          if (ms.matchedIds.length === ex.leftItems.length) {
            finalizeExerciseResult(true, 'Super! Alle 4 paren goed gekoppeld!');
            return;
          }
        } else {
          SoundFX.wrong();
          updateSRS(ms.selectedLeft, false);
          ms.wrongFlash = true;
          render();
          setTimeout(() => {
            if (UI.session === s) {
              ms.selectedLeft = null;
              ms.selectedRight = null;
              ms.wrongFlash = false;
              render();
            }
          }, 420);
          return;
        }
      }
      render();
    }

    function checkCurrentAnswer() {
      const s = UI.session;
      if (!s || s.feedback) return;
      const ex = s.queue[s.index];
      let isCorrect = false;

      if (ex.type === 'mc_th_nl' || ex.type === 'mc_nl_th' || ex.type === 'listen' || ex.type === 'cloze') {
        if (s.selectedOption === null) return;
        isCorrect = !!ex.options[s.selectedOption]?.isCorrect;
      } else if (ex.type === 'build_sentence') {
        if (s.builtTokens.length === 0) return;
        const userStr = s.builtTokens.map(t => t.text).join(' ');
        const targetStr = ex.correctTokens.join(' ');
        isCorrect = userStr === targetStr;
      }

      if (ex.wordId) {
        updateSRS(ex.wordId, isCorrect);
      }

      finalizeExerciseResult(isCorrect);
    }

    function finalizeExerciseResult(isCorrect, customSuccessMsg = null) {
      const s = UI.session;
      const ex = s.queue[s.index];

      if (isCorrect) {
        SoundFX.correct();
        s.combo += 1;
        if (s.combo > s.maxCombo) s.maxCombo = s.combo;
        if (!s.inRetryPhase) s.correctFirstTry += 1;
        const praise = customSuccessMsg || (s.combo >= 3 ? `Geweldig! ${s.combo} op een rij! 🔥` : shuffle(['Uitstekend!', 'Helemaal goed!', 'Goed bezig!', 'Top gedaan!'])[0]);
        s.feedback = {
          correct: true,
          message: praise,
          detail: ex.fullThai ? `${formatThai(ex.fullThai)} — ${formatPhonetic(ex.fullPhonetic)}` : ex.answerText
        };
      } else {
        SoundFX.wrong();
        s.combo = 0;
        s.wrongCount += 1;

        // Bij reguliere opdracht verlies je een hartje (niet bij examen of hartjes-verdienen)
        if (s.mode === 'task') {
          AppState.hearts = Math.max(0, AppState.hearts - 1);
          AppState.lastHeartRegen = Date.now();
          saveState();
        }

        // Didactische fout-herhaling: zet foute vraag in de herhaalwachtrij (behalve bij examen)
        if (s.mode !== 'exam') {
          s.mistakeQueue.push(ex);
        }

        s.feedback = {
          correct: false,
          message: 'Bijna! Onthoud het juiste antwoord:',
          detail: ex.answerText
        };
      }
      render();
    }

    function nextExercise() {
      const s = UI.session;
      if (!s) return;

      // Controleer of hartjes op zijn in taakmodus
      if (s.mode === 'task' && AppState.hearts <= 0) {
        UI.session = null;
        render();
        showNoHeartsModal();
        return;
      }

      s.feedback = null;
      s.selectedOption = null;
      s.builtTokens = [];
      s.matchState = { selectedLeft: null, selectedRight: null, matchedIds: [], wrongFlash: false };

      if (s.index + 1 < s.queue.length) {
        s.index += 1;
        render();
        autoPlayIfListen();
        return;
      }

      // Einde van hoofdronde: zijn er fouten om te herhalen? (Duolingo fout-correctie)
      if (!s.inRetryPhase && s.mistakeQueue.length > 0 && s.mode !== 'exam') {
        s.inRetryPhase = true;
        s.queue = [...s.mistakeQueue];
        s.mistakeQueue = [];
        s.index = 0;
        showToast('🔁 Laten we je fouten nog een keer verbeteren!', 'info');
        render();
        autoPlayIfListen();
        return;
      }

      // Sessie afgerond!
      completeSession();
    }

    function completeSession() {
      const s = UI.session;
      s.finished = true;

      const accuracy = Math.round((s.correctFirstTry / Math.max(1, s.totalInitial)) * 100);
      let earnedXp = 0;
      let earnedGems = 0;
      let examPassed = false;

      if (s.mode === 'task') {
        earnedXp = 15 + (s.wrongCount === 0 ? 5 : 0);
        earnedGems = s.wrongCount === 0 ? 10 : 5;
        const key = String(s.levelId);
        if (!AppState.completedTasks[key]) AppState.completedTasks[key] = [];
        if (!AppState.completedTasks[key].includes(s.taskIdx)) {
          AppState.completedTasks[key].push(s.taskIdx);
        }
        AppState.totalLessons += 1;
        if (s.wrongCount === 0) AppState.perfectLessons += 1;
        AppState.gems += earnedGems;
        recordActivityXp(earnedXp);
        SoundFX.complete();
      } else if (s.mode === 'exam') {
        examPassed = accuracy >= 80;
        if (examPassed) {
          earnedXp = 40;
          earnedGems = 25;
          if (!AppState.passedExams.includes(s.levelId)) {
            AppState.passedExams.push(s.levelId);
          }
          if (AppState.unlockedLevel <= s.levelId && s.levelId < 20) {
            AppState.unlockedLevel = s.levelId + 1;
          }
          AppState.gems += earnedGems;
          recordActivityXp(earnedXp);
          SoundFX.complete();
        } else {
          earnedXp = 10;
          recordActivityXp(earnedXp);
          SoundFX.fail();
        }
      } else if (s.mode === 'hearts') {
        earnedXp = 10;
        AppState.hearts = Math.min(5, AppState.hearts + 2);
        recordActivityXp(earnedXp);
        SoundFX.complete();
      } else {
        earnedXp = 15;
        earnedGems = 5;
        AppState.gems += earnedGems;
        recordActivityXp(earnedXp);
        SoundFX.complete();
      }

      s.summary = { accuracy, earnedXp, earnedGems, examPassed };
      saveState();
      render();
    }

          <!-- Uitgeklapt Kronkelend Leerpad (10 Opdrachten + Niveau-Examen) -->
          ${isExpanded ? `

    // -------------------------
    // 10. LES- & EXAMENSCHERM RENDERER
    // -------------------------
    function renderSessionScreen() {
      const s = UI.session;
      if (s.finished) return renderSessionSummary();

      const ex = s.queue[s.index];
      const progressPct = Math.round((s.index / Math.max(1, s.queue.length)) * 100);

      let canCheck = false;
      if (ex.type === 'mc_th_nl' || ex.type === 'mc_nl_th' || ex.type === 'listen' || ex.type === 'cloze') {
        canCheck = s.selectedOption !== null;
      } else if (ex.type === 'build_sentence') {
        canCheck = s.builtTokens.length > 0;
      }

      return `
        <div class="min-h-screen flex flex-col bg-white">
          <!-- Les Topbalk met voortgangsbalk & hartjes -->
          <div class="px-4 pt-4 pb-3 flex items-center gap-3 border-b border-slate-100">
            <button onclick="exitSessionConfirm()" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-500 font-black text-lg flex items-center justify-center">✕</button>
            <div class="flex-1">
              <div class="flex items-center justify-between text-[11px] font-extrabold text-slate-400 mb-1">
                <span class="truncate">${s.inRetryPhase ? '🔁 Fouten verbeteren' : s.title}</span>
                <span>${s.index + 1}/${s.queue.length}</span>
              </div>
              <div class="w-full h-3.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full rounded-full transition-all duration-300 ${s.mode === 'exam' ? 'bg-[#FFC800]' : s.inRetryPhase ? 'bg-orange-400' : 'bg-[#58CC02]'}" style="width:${Math.max(8, progressPct)}%"></div>
              </div>
            </div>
            ${s.mode === 'task' ? `
              <div class="flex items-center gap-1 font-black text-rose-500 text-sm">
                <span>❤️</span><span>${AppState.hearts}</span>
              </div>
            ` : s.mode === 'exam' ? `
              <div class="px-2 py-1 rounded-xl bg-amber-100 text-amber-800 text-xs font-black">EXAMEN</div>
            ` : `
              <div class="px-2 py-1 rounded-xl bg-sky-100 text-sky-700 text-xs font-black">SRS</div>
            `}
          </div>

          <!-- Combo badge -->
          ${s.combo >= 2 && !s.feedback ? `
            <div class="px-4 pt-2 flex justify-center">
              <span class="px-3 py-0.5 rounded-full bg-orange-100 text-orange-600 text-xs font-black animate-bounce-in">🔥 ${s.combo} op een rij!</span>
            </div>
          ` : ''}

          <!-- Oefening Inhoud -->
          <div class="flex-1 px-4 py-5 flex flex-col justify-between overflow-y-auto">
            <div class="space-y-5">
              <h2 class="text-lg font-black text-slate-800">${ex.promptLabel}</h2>
              ${renderExerciseBody(ex)}
            </div>
          </div>

          <!-- Onderste Actiebalk of Feedback-paneel -->
          ${s.feedback ? `
            <div class="p-4 border-t-2 animate-bounce-in ${s.feedback.correct ? 'bg-[#D7FFB8] border-[#58CC02]/30 text-[#2F6F00]' : 'bg-[#FFDFE0] border-[#FF4B4B]/30 text-[#9E1B1B]'}">
              <div class="flex items-start gap-3 mb-3">
                <span class="text-2xl">${s.feedback.correct ? '✅' : '❌'}</span>
                <div class="min-w-0">
                  <div class="font-black text-base">${s.feedback.message}</div>
                  <div class="text-sm font-bold opacity-90 mt-0.5 thai-text">${s.feedback.detail}</div>
                </div>
              </div>
              <button onclick="nextExercise()" class="duo-btn w-full py-3.5 rounded-2xl text-white font-black text-sm uppercase tracking-wider ${s.feedback.correct ? 'bg-[#58CC02] border-b-4 border-[#46A302]' : 'bg-[#FF4B4B] border-b-4 border-[#D63030]'}">
                Doorgaan
              </button>
            </div>
          ` : ex.type !== 'match_pairs' ? `
            <div class="p-4 border-t-2 border-slate-100 bg-white">
              <button
                onclick="checkCurrentAnswer()"
                ${canCheck ? '' : 'disabled'}
                class="duo-btn w-full py-3.5 rounded-2xl font-black text-sm uppercase tracking-wider ${canCheck ? 'bg-[#58CC02] border-b-4 border-[#46A302] text-white' : 'bg-slate-200 border-b-4 border-slate-300 text-slate-400 cursor-not-allowed'}">
                Controleer
              </button>
            </div>
          ` : `
            <div class="p-3 text-center text-xs font-bold text-slate-400 border-t border-slate-100">
              Tik op een Thais woord links en de Nederlandse vertaling rechts
            </div>
          `}
        </div>
      `;
    }

    function renderExerciseBody(ex) {
      const s = UI.session;

      // 1. Meerkeuze Thais -> Nederlands
      if (ex.type === 'mc_th_nl') {
        const thaiDisp = formatThai(ex.thai);
        const phDisp = formatPhonetic(ex.phonetic);
        return `
          <div class="p-4 rounded-3xl bg-slate-50 border-2 border-slate-200 flex items-center gap-3">
            ${renderElephantSVG('happy', 56)}
            <div class="flex-1 min-w-0">
              <div class="thai-text text-2xl font-bold text-slate-900">${thaiDisp}</div>
              ${AppState.settings.showPhonetics ? `<div class="text-sm font-extrabold text-sky-600 mt-0.5">${phDisp}</div>` : ''}
              <div class="text-[11px] font-bold text-slate-400 mt-0.5">Toon: ${ex.tone}</div>
            </div>
            <div class="flex flex-col gap-1.5">
              <button onclick="SpeechEngine.speak('${thaiDisp.replace(/'/g, "\\'")}', false)" class="duo-btn w-10 h-10 rounded-xl bg-[#1CB0F6] border-b-4 border-[#1899D6] text-white flex items-center justify-center text-lg">🔊</button>
              <button onclick="SpeechEngine.speak('${thaiDisp.replace(/'/g, "\\'")}', true)" class="duo-btn w-10 h-8 rounded-xl bg-sky-100 border-b-2 border-sky-200 text-sky-700 flex items-center justify-center text-xs font-black" title="Langzaam">🐢</button>
            </div>
          </div>
          <div class="space-y-2.5">
            ${ex.options.map((opt, idx) => {
              const sel = s.selectedOption === idx;
              return `
                <button onclick="selectOption(${idx})" class="duo-btn w-full p-4 rounded-2xl border-2 border-b-4 text-left font-extrabold text-sm transition-all flex items-center justify-between ${sel ? 'bg-sky-50 border-[#1CB0F6] text-sky-900' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}">
                  <span>${opt.label}</span>
                  <span class="w-6 h-6 rounded-lg border-2 text-xs flex items-center justify-center font-black ${sel ? 'border-[#1CB0F6] bg-[#1CB0F6] text-white' : 'border-slate-200 text-slate-400'}">${idx + 1}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      // 2. Meerkeuze Nederlands -> Thais
      if (ex.type === 'mc_nl_th') {
        return `
          <div class="p-5 rounded-3xl bg-sky-50 border-2 border-sky-200 text-center">
            <div class="text-xs font-extrabold uppercase tracking-wider text-sky-500 mb-1">Nederlands</div>
            <div class="text-xl font-black text-slate-900">${ex.nlPrompt}</div>
            ${ex.note ? `<div class="text-xs font-bold text-slate-500 mt-1.5">💡 ${ex.note}</div>` : ''}
          </div>
          <div class="grid grid-cols-1 gap-2.5">
            ${ex.options.map((opt, idx) => {
              const sel = s.selectedOption === idx;
              return `
                <button onclick="selectOption(${idx})" class="duo-btn w-full p-4 rounded-2xl border-2 border-b-4 text-left transition-all flex items-center justify-between ${sel ? 'bg-sky-50 border-[#1CB0F6]' : 'bg-white border-slate-200 hover:bg-slate-50'}">
                  <div>
                    <div class="thai-text text-lg font-bold text-slate-900">${formatThai(opt.thai)}</div>
                    ${AppState.settings.showPhonetics ? `<div class="text-xs font-extrabold text-sky-600">${formatPhonetic(opt.phonetic)}</div>` : ''}
                  </div>
                  <span class="text-lg opacity-70">🔊</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      // 3. Luisteroefening (Normaal + Schildpad + Visuele fallback voor apparaten zonder Thaise TTS)
      if (ex.type === 'listen') {
        const thaiDisp = formatThai(ex.thai);
        const phDisp = formatPhonetic(ex.phonetic);
        const hasVoice = SpeechEngine.hasThaiVoice();
        return `
          <div class="p-5 rounded-3xl bg-gradient-to-b from-sky-50 to-white border-2 border-sky-200 flex flex-col items-center gap-3">
            <div class="flex items-center gap-3">
              <button onclick="SpeechEngine.speak('${thaiDisp.replace(/'/g, "\\'")}', false)" class="duo-btn w-20 h-20 rounded-3xl bg-[#1CB0F6] border-b-4 border-[#1899D6] text-white text-4xl flex items-center justify-center shadow-md">🔊</button>
              <button onclick="SpeechEngine.speak('${thaiDisp.replace(/'/g, "\\'")}', true)" class="duo-btn w-14 h-14 rounded-2xl bg-emerald-500 border-b-4 border-emerald-600 text-white text-2xl flex items-center justify-center shadow-md" title="Langzaam afspelen">🐢</button>
            </div>
            <div class="text-center">
              <div class="text-xs font-extrabold text-slate-500">Tik op 🔊 (normaal) of 🐢 (langzaam)</div>
              ${(!hasVoice || AppState.settings.showPhonetics) ? `
                <div class="mt-2 px-3.5 py-1.5 rounded-xl bg-white border border-sky-200 text-sm font-black text-sky-700">
                  Uitspraak: "${phDisp}"
                </div>
              ` : ''}
            </div>
          </div>
          <div class="space-y-2.5">
            ${ex.options.map((opt, idx) => {
              const sel = s.selectedOption === idx;
              return `
                <button onclick="selectOption(${idx})" class="duo-btn w-full p-4 rounded-2xl border-2 border-b-4 text-left font-extrabold text-sm flex items-center justify-between ${sel ? 'bg-sky-50 border-[#1CB0F6] text-sky-900' : 'bg-white border-slate-200 text-slate-700'}">
                  <span>${opt.label}</span>
                  <span class="thai-text text-xs font-bold text-slate-400">${formatThai(opt.thai)}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      // 4. Zin bouwen met tikbare woordblokken (Duolingo Word Bank)
      if (ex.type === 'build_sentence') {
        const usedUids = new Set(s.builtTokens.map(t => t.uid));
        return `
          <div class="p-4 rounded-3xl bg-slate-50 border-2 border-slate-200 flex items-center gap-3">
            ${renderElephantSVG('happy', 52)}
            <div>
              <div class="text-xs font-extrabold text-slate-400 uppercase">Vertaal naar het Thais</div>
              <div class="text-base font-black text-slate-900 mt-0.5">"${ex.nlPrompt}"</div>
              ${AppState.settings.showPhonetics ? `<div class="text-xs font-bold text-sky-600 mt-1">Hint: ${formatPhonetic(ex.fullPhonetic)}</div>` : ''}
            </div>
          </div>

          <!-- Antwoordzone -->
          <div class="min-h-[82px] p-3 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50/70 flex flex-wrap gap-2 items-center">
            ${s.builtTokens.length === 0 ? `<span class="text-xs font-bold text-slate-400 mx-auto">Tik hieronder op de Thaise woordblokken in de juiste volgorde...</span>` : ''}
            ${s.builtTokens.map(tok => `
              <button onclick="removeBuiltToken('${tok.uid}')" class="duo-btn px-3.5 py-2 rounded-2xl bg-sky-100 border-2 border-b-4 border-[#1CB0F6] text-sky-900 thai-text font-bold text-base animate-bounce-in">
                ${tok.text}
              </button>
            `).join('')}
          </div>

          <!-- Woordbank -->
          <div class="flex flex-wrap justify-center gap-2 pt-2">
            ${ex.bank.map(tok => {
              const used = usedUids.has(tok.uid);
              return `
                <button
                  onclick="tapBankToken('${tok.uid}')"
                  ${used ? 'disabled' : ''}
                  class="duo-btn px-4 py-2.5 rounded-2xl border-2 border-b-4 thai-text font-bold text-base transition-all ${used ? 'bg-slate-100 border-slate-200 text-transparent select-none' : 'bg-white border-slate-300 text-slate-800 hover:bg-slate-50'}">
                  ${tok.text}
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      // 5. Invuloefening (Cloze / Actief ophalen)
      if (ex.type === 'cloze') {
        return `
          <div class="p-4 rounded-3xl bg-amber-50 border-2 border-amber-200 space-y-2.5">
            <div class="text-xs font-extrabold uppercase text-amber-700">Nederlands: "${ex.nlPrompt}"</div>
            <div class="flex flex-wrap items-center gap-2 pt-1">
              ${ex.tokens.map((t, i) => i === ex.blankIdx
                ? `<span class="px-4 py-1.5 rounded-xl bg-white border-2 border-dashed border-amber-400 text-amber-700 thai-text font-black text-lg min-w-[70px] text-center">${s.selectedOption !== null ? ex.options[s.selectedOption].text : '___'}</span>`
                : `<span class="px-2.5 py-1 rounded-xl bg-white/80 text-slate-800 thai-text font-bold text-lg">${t}</span>`
              ).join('')}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            ${ex.options.map((opt, idx) => {
              const sel = s.selectedOption === idx;
              return `
                <button onclick="selectOption(${idx})" class="duo-btn p-4 rounded-2xl border-2 border-b-4 text-center transition-all ${sel ? 'bg-sky-50 border-[#1CB0F6]' : 'bg-white border-slate-200'}">
                  <div class="thai-text text-lg font-bold text-slate-900">${opt.text}</div>
                  ${AppState.settings.showPhonetics && opt.ph ? `<div class="text-xs font-bold text-sky-600 mt-0.5">${opt.ph}</div>` : ''}
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      // 6. Paren Matchen (4 paren Thais <-> Nederlands)
      if (ex.type === 'match_pairs') {
        const ms = s.matchState;
        return `
          <div class="grid grid-cols-2 gap-3 ${ms.wrongFlash ? 'animate-shake' : ''}">
            <!-- Linkerkolom: Thais -->
            <div class="space-y-2.5">
              ${ex.leftItems.map(item => {
                const matched = ms.matchedIds.includes(item.id);
                const selected = ms.selectedLeft === item.id;
                const cls = matched
                  ? 'bg-emerald-50 border-emerald-200 text-emerald-400 opacity-50'
                  : selected && ms.wrongFlash
                    ? 'bg-rose-50 border-rose-400 text-rose-700'
                    : selected
                      ? 'bg-sky-50 border-[#1CB0F6] text-sky-900'
                      : 'bg-white border-slate-200 text-slate-800';
                return `
                  <button onclick="tapMatchCard('left', '${item.id}')" ${matched ? 'disabled' : ''} class="duo-btn w-full min-h-[72px] p-3 rounded-2xl border-2 border-b-4 text-center flex flex-col items-center justify-center ${cls}">
                    <span class="thai-text font-bold text-base leading-tight">${formatThai(item.thai)}</span>
                    ${AppState.settings.showPhonetics ? `<span class="text-[11px] font-bold text-sky-600 mt-0.5">${formatPhonetic(item.phonetic)}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Rechterkolom: Nederlands -->
            <div class="space-y-2.5">
              ${ex.rightItems.map(item => {
                const matched = ms.matchedIds.includes(item.id);
                const selected = ms.selectedRight === item.id;
                const cls = matched
                  ? 'bg-emerald-50 border-emerald-200 text-emerald-400 opacity-50'
                  : selected && ms.wrongFlash
                    ? 'bg-rose-50 border-rose-400 text-rose-700'
                    : selected
                      ? 'bg-sky-50 border-[#1CB0F6] text-sky-900'
                      : 'bg-white border-slate-200 text-slate-800';
                return `
                  <button onclick="tapMatchCard('right', '${item.id}')" ${matched ? 'disabled' : ''} class="duo-btn w-full min-h-[72px] p-3 rounded-2xl border-2 border-b-4 text-center flex items-center justify-center font-extrabold text-xs leading-snug ${cls}">
                    ${item.nl}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    // Afrondingsscherm na een Les, Examen of Herhaalronde
    function renderSessionSummary() {
      const s = UI.session;
      const sum = s.summary;
      const isExamFail = s.mode === 'exam' && !sum.examPassed;

      return `
        <div class="min-h-screen flex flex-col justify-between p-6 bg-white text-center">
          <div class="pt-6 space-y-4 animate-bounce-in">
            <div class="animate-float">${renderElephantSVG(isExamFail ? 'sad' : 'happy', 110)}</div>

            ${s.mode === 'exam' ? `
              <div class="inline-block px-4 py-1.5 rounded-full font-black text-xs uppercase tracking-wider ${sum.examPassed ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-700'}">
                ${sum.examPassed ? `🏆 Niveau ${s.levelId} Examen Gehaald!` : `Examen Nog Niet Gehaald (Min. 80% nodig)`}
              </div>
              <h2 class="text-2xl font-black text-slate-900">
                ${sum.examPassed
                  ? (s.levelId < 20 ? `Niveau ${s.levelId + 1} is nu vrijgespeeld! 🎉` : 'Alle 20 niveaus voltooid! 👑')
                  : 'Je bent er bijna — probeer het gerust opnieuw!'}
              </h2>
            ` : `
              <div class="inline-block px-4 py-1.5 rounded-full bg-emerald-100 text-emerald-800 font-black text-xs uppercase tracking-wider">
                ${s.mode === 'hearts' ? '❤️ +2 Hartjes Verdiend!' : 'Opdracht Voltooid!'}
              </div>
              <h2 class="text-2xl font-black text-slate-900">
                ${s.wrongCount === 0 ? 'Foutloze ronde! ✨' : 'Geweldig geoefend! 🎉'}
              </h2>
            `}

            <p class="text-sm font-bold text-slate-500">
              ${s.mode === 'exam' && !sum.examPassed
                ? 'Herhaal even de moeilijke woorden via de SRS-tab en slaag bij je volgende poging!'
                : 'Je voortgang en SRS-geheugen zijn automatisch opgeslagen.'}
            </p>

            <!-- Resultaat Tegels -->
            <div class="grid grid-cols-3 gap-2.5 pt-3">
              <div class="p-3.5 rounded-2xl border-2 border-amber-200 bg-amber-50">
                <div class="text-[11px] font-extrabold uppercase text-amber-600">XP</div>
                <div class="text-xl font-black text-amber-700 mt-0.5">+${sum.earnedXp}</div>
              </div>
              <div class="p-3.5 rounded-2xl border-2 border-emerald-200 bg-emerald-50">
                <div class="text-[11px] font-extrabold uppercase text-emerald-600">Score</div>
                <div class="text-xl font-black text-emerald-700 mt-0.5">${sum.accuracy}%</div>
              </div>
              <div class="p-3.5 rounded-2xl border-2 border-sky-200 bg-sky-50">
                <div class="text-[11px] font-extrabold uppercase text-sky-600">Gems</div>
                <div class="text-xl font-black text-sky-700 mt-0.5">+${sum.earnedGems} 💎</div>
              </div>
            </div>
          </div>

          <div class="space-y-2.5 pb-4">
            ${isExamFail ? `
              <button onclick="startExamSession(${s.levelId})" class="duo-btn w-full py-4 rounded-2xl bg-[#FFC800] border-b-4 border-[#D9A600] text-amber-950 font-black text-sm uppercase tracking-wider">Opnieuw Examen Doen</button>
            ` : ''}
            <button onclick="UI.session = null; ${sum.examPassed && s.levelId < 20 ? `UI.expandedLevel = ${s.levelId + 1};` : ''} render();" class="duo-btn w-full py-4 rounded-2xl bg-[#58CC02] border-b-4 border-[#46A302] text-white font-black text-sm uppercase tracking-wider">
              Verder naar Leerpad
            </button>
          </div>
        </div>
      `;
    }

    // -------------------------
    // 11. INSTELLINGEN & BACK-UP ACTIES
    // -------------------------
    function switchTab(tabId) {
      SoundFX.pop();
      UI.tab = tabId;
      render();
    }

    function toggleLevelExpand(levelId) {
      SoundFX.pop();
      const currentlyExpanded = UI.expandedLevel !== null ? UI.expandedLevel === levelId : levelId === AppState.unlockedLevel;
      UI.expandedLevel = currentlyExpanded ? -1 : levelId;
      render();
    }

    function toggleGender() {
      SoundFX.pop();
      AppState.settings.gender = AppState.settings.gender === 'male' ? 'female' : 'male';
      saveState();
      showToast(AppState.settings.gender === 'male' ? 'Ingesteld op Man (ครับ / ผม)' : 'Ingesteld op Vrouw (ค่ะ / ฉัน)', 'info');
      render();
    }

    function togglePhonetics() {
      SoundFX.pop();
      AppState.settings.showPhonetics = !AppState.settings.showPhonetics;
      saveState();
      showToast(AppState.settings.showPhonetics ? 'Fonetische uitspraak AAN' : 'Fonetische uitspraak UIT (echt Thais schrift!)', 'info');
      render();
    }

    function toggleSound() {
      AppState.settings.soundOn = !AppState.settings.soundOn;
      saveState();
      if (AppState.settings.soundOn) SoundFX.pop();
      render();
    }

    function togglePreviewUnlock() {
      SoundFX.pop();
      AppState.settings.unlockAllPreview = !AppState.settings.unlockAllPreview;
      saveState();
      showToast(AppState.settings.unlockAllPreview ? '🔓 Alle 20 niveaus tijdelijk open om te bekijken!' : '🔒 Normaal progressief leerpad hersteld.', 'info');
      render();
    }

    // Export JSON via execCommand('copy') (veilig voor iframes en mobiel)
    function openExportModal() {
      const jsonStr = JSON.stringify(AppState, null, 2);
      openModal(`
        <div class="p-5 space-y-3">
          <h3 class="text-lg font-black text-slate-800">📤 Voortgang Exporteren</h3>
          <p class="text-xs text-slate-500">Kopieer deze JSON-code en bewaar hem om je voortgang op een ander apparaat te herstellen.</p>
          <textarea id="export-textarea" readonly class="w-full h-40 p-3 rounded-2xl bg-slate-50 border-2 border-slate-200 text-[11px] font-mono text-slate-700">${jsonStr.replace(/</g, '&lt;')}</textarea>
          <div class="flex gap-2">
            <button onclick="copyExportJson()" class="duo-btn flex-1 py-3 rounded-2xl bg-[#58CC02] border-b-4 border-[#46A302] text-white font-extrabold text-sm">Kopieer JSON</button>
            <button onclick="closeModal()" class="duo-btn px-4 py-3 rounded-2xl bg-slate-100 border-b-4 border-slate-300 text-slate-700 font-extrabold text-sm">Sluit</button>
          </div>
        </div>
      `);
    }

    function copyExportJson() {
      const ta = document.getElementById('export-textarea');
      if (!ta) return;
      ta.select();
      ta.setSelectionRange(0, 999999);
      try {
        document.execCommand('copy');
        showToast('Voortgang gekopieerd naar klembord!', 'success');
      } catch (e) {
        showToast('Selecteer en kopieer de tekst handmatig.', 'info');
      }
    }

    function openImportModal() {
      openModal(`
        <div class="p-5 space-y-3">
          <h3 class="text-lg font-black text-slate-800">📥 Voortgang Importeren</h3>
          <p class="text-xs text-slate-500">Plak hier je eerder geëxporteerde SawasdeeLingo JSON-code.</p>
          <textarea id="import-textarea" placeholder='{"unlockedLevel": 1, ...}' class="w-full h-36 p-3 rounded-2xl bg-slate-50 border-2 border-slate-200 text-xs font-mono text-slate-700"></textarea>
          <div class="flex gap-2">
            <button onclick="applyImportJson()" class="duo-btn flex-1 py-3 rounded-2xl bg-[#1CB0F6] border-b-4 border-[#1899D6] text-white font-extrabold text-sm">Herstel Voortgang</button>
            <button onclick="closeModal()" class="duo-btn px-4 py-3 rounded-2xl bg-slate-100 border-b-4 border-slate-300 text-slate-700 font-extrabold text-sm">Annuleer</button>
          </div>
        </div>
      `);
    }

    function applyImportJson() {
      const ta = document.getElementById('import-textarea');
      if (!ta || !ta.value.trim()) return;
      try {
        const parsed = JSON.parse(ta.value.trim());
        if (typeof parsed.unlockedLevel !== 'number') throw new Error('Ongeldig formaat');
        const def = createDefaultState();
        AppState = { ...def, ...parsed, settings: { ...def.settings, ...(parsed.settings || {}) } };
        saveState();
        closeModal();
        SoundFX.complete();
        showToast('✅ Voortgang succesvol geïmporteerd!', 'success');
        render();
      } catch (e) {
        showToast('❌ Ongeldige JSON-code. Controleer je plaktekst.', 'error');
      }
    }

    function confirmResetProgress() {
      openModal(`
        <div class="p-6 text-center space-y-4">
          <div class="text-4xl">⚠️</div>
          <h3 class="text-lg font-black text-slate-800">Alle voortgang wissen?</h3>
          <p class="text-sm text-slate-600">Je begint weer op Niveau 1 met 0 XP. Dit kan niet ongedaan worden gemaakt (tenzij je eerst een JSON back-up exporteert).</p>
          <div class="space-y-2 pt-1">
            <button onclick="executeResetProgress()" class="duo-btn w-full py-3 rounded-2xl bg-[#FF4B4B] border-b-4 border-[#D63030] text-white font-extrabold text-sm">Ja, wis alles</button>
            <button onclick="closeModal()" class="duo-btn w-full py-3 rounded-2xl bg-slate-100 border-b-4 border-slate-300 text-slate-700 font-extrabold text-sm">Annuleren</button>
          </div>
        </div>
      `);
    }

    function executeResetProgress() {
      localStorage.removeItem(STORAGE_KEY);
      AppState = createDefaultState();
      UI.expandedLevel = 1;
      saveState();
      closeModal();
      showToast('Voortgang gewist. Succes met je nieuwe start!', 'info');
      render();
    }

    // -------------------------
    // 12. INITIALISATIE BIJ OPSTARTEN
    // -------------------------
    window.addEventListener('DOMContentLoaded', () => {
      syncDailyAndHearts();
      render();
      // Toon eenmalig de korte welkomstrondleiding voor nieuwe gebruikers
      if (!AppState.seenWelcomeTour) {
        setTimeout(() => showTourModal(0), 350);
      }
    });
  </script>
</body>
</html>
